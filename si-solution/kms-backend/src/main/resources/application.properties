spring.application.name=kms-backend

# ── PostgreSQL ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/kms_db
spring.datasource.username=kms_user
spring.datasource.password=kms_pass_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.jpa.show-sql=false

# ── Flyway (스키마/시드 마이그레이션) ───────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── 서버 ────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/

# ── 파일 업로드(문서관리 DMS) ───────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
kms.storage.root=/home/user/webapp/si-solution/kms-storage

# ── CORS (Vue dev server) ───────────────────────────────────
kms.cors.allowed-origins=http://localhost:5173,http://localhost:3000

logging.level.com.kms.docmanagement=INFO
